        <h1>Path Import — Convert Arc &amp; Moves Backups Locally</h1>
        <p>Path Import is a free, 100% private, client-side WebAssembly tool that converts historical location history archives from Arc App and Moves into an on-device SQLite database for Path on iOS.</p>
        <h2>Privacy Guarantee</h2>
        <p>Everything is read, parsed, and converted entirely on your local machine using SQLite WebAssembly. Zero data is uploaded to any server. Once the page is loaded, you can disconnect from the internet and run the tool offline.</p>
        <h2>Supported Formats</h2>
        <ul>
          <li><strong>Arc App:</strong> Unzipped folders containing Arc Export, Arc Previous Backups, daily JSON, and GPX tracks.</li>
          <li><strong>Moves App:</strong> Unzipped folders containing json/daily/storyline or daily storyline JSON archives.</li>
        </ul>
        <h2>How to Import</h2>
        <ol>
          <li>Select your unzipped Arc or Moves backup folder.</li>
          <li>Wait for Path Import to build your SQLite database file locally.</li>
          <li>Transfer the resulting <code>.db</code> file to your iPhone (via AirDrop, iCloud Drive, or Files app).</li>
          <li>Open Path on iPhone, go to Settings &gt; Data Management &gt; Import Data, and select the file.</li>
        </ol>
        <p><a href="https://path.autheai.com/">Visit Path Official Website</a> | <a href="https://github.com/PathDevOrg/PathImportTools">View on GitHub</a></p>
